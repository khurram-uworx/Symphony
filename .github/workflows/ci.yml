name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore Symphony.slnx

    - name: Verify formatting
      run: dotnet format Symphony.slnx whitespace --verify-no-changes --no-restore

    - name: Build
      run: dotnet build tests/Symphony.Tests/Symphony.Tests.csproj --no-restore --configuration Release

    - name: Test
      run: dotnet test tests/Symphony.Tests/Symphony.Tests.csproj --no-build --configuration Release --verbosity normal --filter "Category!=Integration&Category!=Smoke&Category!=ReleaseReadiness" --logger "trx;LogFileName=ci.trx" --results-directory TestResults --collect:"XPlat Code Coverage"

    - name: Upload test durations
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-durations
        path: TestResults/**/*.trx
        if-no-files-found: warn

    - name: Upload coverage reports
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v7
      with:
        files: '**/coverage.cobertura.xml'
        fail_ci_if_error: false
