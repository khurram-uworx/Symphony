name: CD

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.9.1)'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Set version
      run: |
        if [[ -n "${{ github.event.inputs.version }}" ]]; then
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
        else
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
        fi

    - name: Restore dependencies
      run: dotnet restore tests/Symphony.Tests/Symphony.Tests.csproj

    - name: Build
      run: dotnet build tests/Symphony.Tests/Symphony.Tests.csproj --no-restore --configuration Release

    - name: Test
      run: dotnet test tests/Symphony.Tests/Symphony.Tests.csproj --no-build --configuration Release --verbosity normal --filter "Category!=Integration&Category!=Smoke" --logger "trx;LogFileName=ci.trx" --results-directory TestResults
