services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    image: ${SYMPHONY_IMAGE:-ghcr.io/khurram-uworx/symphony:latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DataProtection__KeysPath: ${DataProtection__KeysPath:-/home/app/.aspnet/DataProtection-Keys}
      Database__Provider: ${Database__Provider}
      ConnectionStrings__PostgreSQL: ${ConnectionStrings__PostgreSQL}
      SeedAdmin__UserName: ${SeedAdmin__UserName}
      ApiKeys__ServerKey: ${ApiKeys__ServerKey}
      SYMPHONY_WORKSPACE_ROOT: ${SYMPHONY_WORKSPACE_ROOT:-/home/app/workspaces}
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
    volumes:
      - dataprotection:/home/app/.aspnet/DataProtection-Keys
      - workspaces:/home/app/workspaces
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  pgdata:
  dataprotection:
  workspaces:
